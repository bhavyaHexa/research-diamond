name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Writes auth/auth.config.js (salted hash of the access key) for the site's
      # key screen. Fails the deploy if the secret is missing.
      - name: Build access gate config
        run: node auth/build-auth.mjs
        env:
          APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build output to S3
        run: |
          aws s3 sync . "s3://${{ secrets.S3_BUCKET_NAME }}" --delete \
            --exclude ".git/*" --exclude ".github/*" --exclude ".gitignore" \
            --exclude ".env*" --exclude "auth/build-auth.mjs"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
